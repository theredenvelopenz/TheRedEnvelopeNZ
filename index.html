<canvas id="bg-canvas"></canvas>
<div id="bg-skeleton"></div>
<video id="bg-video" src="assets/bg-video.mp4" muted loop playsInline webkit-playsinline="true" autoplay style="position:fixed;inset:0;width:100%;height:100%;opacity:0;pointer-events:none;z-index:-1;"></video>
<div id="root" class="relative" style="z-index:2;"></div>
<script>
(function(){
  var canvas = document.getElementById('bg-canvas');
  var video = document.getElementById('bg-video');
  var skeleton = document.getElementById('bg-skeleton');

  function hideSkeleton(){
    if (!skeleton) return;
    skeleton.style.opacity = '0';
    setTimeout(function(){ if (skeleton.parentNode) skeleton.parentNode.removeChild(skeleton); }, 550);
  }

  var isMobile = window.matchMedia('(max-width: 767px)').matches;
  var supportsWebGL = (function(){
    try { var c = document.createElement('canvas'); return !!(window.WebGLRenderingContext && (c.getContext('webgl') || c.getContext('experimental-webgl'))); }
    catch (e) { return false; }
  })();

  var tryPlay = function(){ video.play().catch(function(){}); };
  video.muted = true;
  video.defaultMuted = true;

  /* Responsive fallback: skip the WebGL scene entirely on phones / no-WebGL browsers.
     Plain looping <video> costs far less battery than a shader pass every frame. */
  if (isMobile || !supportsWebGL) {
    canvas.style.display = 'none';
    Object.assign(video.style, {
      position: 'fixed', inset: '0', width: '100%', height: '100%',
      objectFit: 'cover', opacity: '1', pointerEvents: 'none', zIndex: '0'
    });
    var overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(circle at 50% 42%, rgba(10,5,3,0) 35%, rgba(10,5,3,.6) 100%);';
    document.body.insertBefore(overlay, document.getElementById('root'));
    video.addEventListener('loadeddata', hideSkeleton, { once: true });
    tryPlay();
    video.addEventListener('canplay', tryPlay);
    document.addEventListener('click', tryPlay, { once: true });
    document.addEventListener('touchstart', tryPlay, { once: true });
    return;
  }

  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  if (renderer.outputEncoding !== undefined) renderer.outputEncoding = THREE.sRGBEncoding;
  var scene = new THREE.Scene();
  var camera = new THREE.Camera();
  var texture = new THREE.VideoTexture(video);
  texture.minFilter = THREE.LinearFilter;
  texture.magFilter = THREE.LinearFilter;
  if (texture.encoding !== undefined) texture.encoding = THREE.sRGBEncoding;

  var VIDEO_ASPECT = 1280 / 720;
  var material = new THREE.ShaderMaterial({
    uniforms: {
      map: { value: texture },
      planeAspect: { value: 1 },
      videoAspect: { value: VIDEO_ASPECT },
      time: { value: 0 },
      zoom: { value: 1 },
      darken: { value: 0 },
      tint: { value: new THREE.Color(0x2a0a08) }
    },
    vertexShader: "varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position, 1.0); }",
    fragmentShader: [
      "uniform sampler2D map;",
      "uniform float planeAspect;",
      "uniform float videoAspect;",
      "uniform float time;",
      "uniform float zoom;",
      "uniform float darken;",
      "uniform vec3 tint;",
      "varying vec2 vUv;",
      "float rand(vec2 co){ return fract(sin(dot(co.xy, vec2(12.9898,78.233))) * 43758.5453); }",
      "void main(){",
      "  float ar = planeAspect / videoAspect;",
      "  vec2 ratio = vec2(min(ar,1.0), min(1.0/ar,1.0));",
      "  vec2 uv = vec2(vUv.x * ratio.x + (1.0-ratio.x)*0.5, vUv.y * ratio.y + (1.0-ratio.y)*0.5);",
      "  uv = (uv - 0.5) / zoom + 0.5;",
      "  vec3 color = texture2D(map, uv).rgb;",
      "  color = mix(color, tint, 0.05);",
      "  float d = distance(vUv, vec2(0.5));",
      "  color *= smoothstep(0.9, 0.3, d) * 0.35 + 0.65;",
      "  color *= (1.0 - darken * 0.4);",
      "  float grain = (rand(vUv * time) - 0.5) * 0.03;",
      "  color += grain;",
      "  gl_FragColor = vec4(color, 1.0);",
      "}"
    ].join("\n")
  });
  var mesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material);
  scene.add(mesh);

  function resize() {
    var w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h);
    material.uniforms.planeAspect.value = w / h;
  }
  window.addEventListener('resize', resize);
  resize();

  /* Scroll-sequenced narrative: the background slowly pushes in and dims as the
     page is read, instead of sitting static behind the copy. */
  var scrollT = 0;
  function onScroll() {
    var max = Math.max(document.documentElement.scrollHeight - window.innerHeight, 1);
    scrollT = Math.min(Math.max(window.scrollY / max, 0), 1);
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();

  video.addEventListener('loadeddata', hideSkeleton, { once: true });
  tryPlay();
  video.addEventListener('canplay', tryPlay);
  document.addEventListener('click', tryPlay, { once: true });
  document.addEventListener('touchstart', tryPlay, { once: true });

  function animate(t) {
    material.uniforms.time.value = t * 0.001;
    material.uniforms.zoom.value = 1 + scrollT * 0.12;
    material.uniforms.darken.value = scrollT;
    renderer.render(scene, camera);
    requestAnimationFrame(animate);
  }
  requestAnimationFrame(animate);
})();
</script>

function ChatWidget() {
  const [open, setOpen] = useState(false);
  const [messages, setMessages] = useState([
    { from: "bot", text: "Woof! I'm Scrappy Coco 🐾 — ask me about our services, pricing, or coaching, or tap a button below." }
  ]);
  const [input, setInput] = useState("");
  const [typing, setTyping] = useState(false);
  const [userName, setUserName] = useState(null);
  const listRef = useRef(null);

  /* Point this at a deployed serverless endpoint (see api/chat.js) to give Scrappy Coco
     a real Claude-powered brain. Leave blank to run entirely on the offline fallback below —
     that's what runs here since a static page can't safely hold an API key. */
  const CHAT_API_URL = "";

  useEffect(() => {
    if (listRef.current) listRef.current.scrollTop = listRef.current.scrollHeight;
  }, [messages, typing, open]);

  const QUICK = [
    { label: "Our services", msg: "What services do you offer?" },
    { label: "Book a chat", msg: "I want to book a consultation" },
  ];

  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

  const SERVICE_INFO = {
    marketing: { keys: ["market", "strategy", "position", "consult"], text: "Marketing & Consultancy: strategy, positioning, and growth plans built around your actual numbers, not a template." },
    coaching: { keys: ["coach", "mentor"], text: "Coaching: regular 1:1 sessions focused on the decisions in front of you this month, for owners, managers, and small leadership teams." },
    analytics: { keys: ["analytic", "google analytics", " data", "seo", "improvement"], text: "Analytics & Business Improvement: Google Analytics audits that turn data into decisions instead of a dashboard nobody checks." },
    website: { keys: ["website", "web design", "web build", " site", "webpage"], text: "Website Building & Improvement: modern, fast, mobile-first sites, whether that's from scratch or fixing what you've already got." },
    ai: { keys: ["automation", "chatbot", " ai ", " ai,", " ai."], text: "AI Services: automation, AI assistants (a bit like me, but with a real brain), and workflow tooling that saves hours." },
    airbnb: { keys: ["airbnb", "cleaning", "property"], text: "Airbnb Management & Cleaning: guest turnover, professional cleaning, and the hands-on upkeep side of a property." },
  };

  function respond(raw) {
    const t = " " + raw.toLowerCase() + " ";
    const has = (...words) => words.some((w) => t.includes(w));
    const nameMatch = raw.match(/(?:my name is|i'?m|i am)\s+([a-zA-Z]{2,20})/i);
    if (nameMatch) setUserName(nameMatch[1]);

    if (has("who are you", "what are you", "scrappy", "mascot", "your name"))
      return "I'm Scrappy Coco — mascot round here, moonlighting as the front desk. Ask me about services, pricing, or coaching.";

    if (has("hi", "hello", "hey", "sup", "yo ", "morning"))
      return pick([
        (userName ? `Good to see you, ${userName}! ` : "Woof! ") + "What can I help with — services, pricing, or booking a chat?",
        "Hey there 🐾 Ask me about any of our services, or I can point you to the contact form.",
      ]);

    // Check every service for a match — visitors often ask about two things in one line.
    const matched = Object.values(SERVICE_INFO).filter((s) => has(...s.keys));
    if (matched.length === 1) return matched[0].text;
    if (matched.length > 1) return matched.map((s) => s.text).join(" ");

    if (has("service", "offer", "what do you do", "help with"))
      return "Six things: marketing & consultancy, coaching, Google Analytics & business improvement, website builds, AI services, and Airbnb management & cleaning. Want detail on one?";
    if (has("price", "cost", "how much", "pricing", "quote"))
      return "Pricing depends on the mix of services — most people start with a quick consultation so we can quote properly. Want me to jump you to the contact form?";
    if (has("book", "contact", "talk to", "human", "call", "enquir"))
      return "Good call — the contact form is the fastest way in. Scrolling you there now.";
    if (has("thank"))
      return pick(["Anytime! 🐾", "Happy to help!"]);
    if (has("bye", "goodbye", "see ya"))
      return "Catch you later — I'll be here if you need anything else.";

    return "Hmm, didn't quite catch that — try asking about one of our services (marketing, coaching, analytics, websites, AI, or Airbnb & cleaning), or say \"book a chat\" and I'll get you to the form.";
  }

  async function send(text) {
    const clean = text.trim();
    if (!clean) return;
    const history = [...messages, { from: "user", text: clean }];
    setMessages(history);
    setInput("");
    setTyping(true);

    let replyText = null;
    if (CHAT_API_URL) {
      try {
        const res = await fetch(CHAT_API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            messages: history.map((m) => ({ role: m.from === "user" ? "user" : "assistant", content: m.text }))
          })
        });
        if (res.ok) {
          const data = await res.json();
          replyText = (data.text || "").trim() || null;
        }
      } catch (e) { /* fall through to offline responder */ }
    }
    if (!replyText) replyText = respond(clean);

    setTimeout(() => {
      setMessages((m) => [...m, { from: "bot", text: replyText }]);
      setTyping(false);
      if (/contact form|jump you|scrolling you/i.test(replyText)) {
        setTimeout(() => {
          const el = document.getElementById("contact");
          if (el) el.scrollIntoView({ behavior: "smooth" });
        }, 400);
      }
    }, 450 + Math.random() * 350);
  }

  return (
    <>
      <button onClick={() => setOpen((o) => !o)} aria-label="Chat with Scrappy Coco"
        className="fixed bottom-6 right-6 z-50 w-14 h-14 rounded-full flex items-center justify-center text-2xl shadow-2xl border border-[#c9973f]/40"
        style={{ background: open ? "#12171d" : GOLD }}>
        {open ? <X size={20} color="#f2efe9" /> : "🐾"}
      </button>

      <div className={"fixed bottom-24 right-6 z-50 w-[88vw] max-w-[340px] h-[440px] bg-[#0e1319] border border-[#c9973f]/25 rounded-2xl shadow-2xl flex flex-col overflow-hidden fade " + (open ? "opacity-100" : "opacity-0 pointer-events-none translate-y-2")}
           style={{ transition: "opacity .25s ease, transform .25s ease" }}>
        <div className="flex items-center gap-2.5 px-4 py-3 border-b border-white/10 bg-white/[0.03]">
          <span className="w-9 h-9 rounded-full flex items-center justify-center text-lg" style={{ background: GOLD }}>🐕</span>
          <div>
            <p className="text-sm font-semibold leading-tight">Scrappy Coco</p>
            <p className="text-[11px] text-[#a9a49a] flex items-center gap-1"><span className="w-1.5 h-1.5 rounded-full bg-green-400"></span> Online</p>
          </div>
        </div>

        <div ref={listRef} className="flex-1 overflow-y-auto px-3 py-3 space-y-2.5">
          {messages.map((m, i) => (
            <div key={i} className={"flex " + (m.from === "user" ? "justify-end" : "justify-start")}>
              <div className={"max-w-[80%] rounded-2xl px-3.5 py-2 text-[13.5px] leading-snug " + (m.from === "user" ? "text-[#0b0f13] rounded-br-sm" : "bg-white/[0.06] text-[#f2efe9] rounded-bl-sm")}
                   style={m.from === "user" ? { background: GOLD } : {}}>
                {m.text}
              </div>
            </div>
          ))}
          {typing && (
            <div className="flex justify-start">
              <div className="bg-white/[0.06] rounded-2xl rounded-bl-sm px-3.5 py-2.5 flex gap-1">
                <span className="w-1.5 h-1.5 rounded-full bg-[#a9a49a] animate-bounce" style={{ animationDelay: "0ms" }}></span>
                <span className="w-1.5 h-1.5 rounded-full bg-[#a9a49a] animate-bounce" style={{ animationDelay: "120ms" }}></span>
                <span className="w-1.5 h-1.5 rounded-full bg-[#a9a49a] animate-bounce" style={{ animationDelay: "240ms" }}></span>
              </div>
            </div>
          )}
        </div>

        {messages.length < 3 && (
          <div className="px-3 pb-2 flex flex-wrap gap-1.5">
            {QUICK.map((q) => (
              <button key={q.label} onClick={() => send(q.msg)}
                className="text-[12px] px-3 py-1.5 rounded-full border border-[#c9973f]/40 text-[#e8cf9f] hover:bg-[#c9973f]/10 transition-colors">
                {q.label}
              </button>
            ))}
          </div>
        )}

        <form onSubmit={(e) => { e.preventDefault(); send(input); }} className="flex items-center gap-2 p-2.5 border-t border-white/10">
          <input value={input} onChange={(e) => setInput(e.target.value)} placeholder="Ask Scrappy Coco..."
                 className="flex-1 bg-white/5 border border-white/10 rounded-xl px-3 py-2 text-[13.5px] placeholder:text-[#7d786e] outline-none" />
          <button type="submit" className="w-9 h-9 rounded-xl flex items-center justify-center flex-shrink-0" style={{ background: GOLD }}>
            <ArrowRight size={16} color="#0b0f13" />
          </button>
        </form>
      </div>
    </>
  );
}

function App() {
  const [scrolled, setScrolled] = useState(false);
  const [drawerOpen, setDrawerOpen] = useState(false);
  const [toast, setToast] = useState({ msg: "", show: false });
  const [revealed, setRevealed] = useState(false);

  useEffect(() => {
    const onScroll = () => setScrolled(window.scrollY > 20);
    window.addEventListener("scroll", onScroll);
    const t = setTimeout(() => setRevealed(true), 700);
    return () => { window.removeEventListener("scroll", onScroll); clearTimeout(t); };
  }, []);

  const notify = (msg) => {
    setToast({ msg, show: true });
    setTimeout(() => setToast((s) => ({ ...s, show: false })), 3000);
  };

  const submit = (e) => {
    e.preventDefault();
    notify("Thanks — we'll be in touch within a couple of days.");
    e.target.reset();
  };

  return (
    <div className="relative min-h-screen text-[#f2efe9] overflow-x-hidden">
      <Toast message={toast.msg} show={toast.show} />
      <Navbar scrolled={scrolled} onMenu={() => setDrawerOpen(true)} />
      <Drawer open={drawerOpen} onClose={() => setDrawerOpen(false)} />
      <ChatWidget />

      <section id="home" className="relative min-h-screen pt-32 pb-20 flex items-center z-10">
        <div className="max-w-[1680px] mx-auto px-8 lg:px-12 w-full grid grid-cols-1 lg:grid-cols-12 gap-12 items-center">
          <div className="lg:col-span-7 z-20" style={{ opacity: revealed ? 1 : 0, transform: revealed ? "translateY(0)" : "translateY(16px)", transition: "opacity .6s ease, transform .6s ease" }}>
            <p className="font-display italic text-lg text-[#c9973f] mb-2">Marketing, coaching & business services</p>
            <h1 className="font-display font-semibold tracking-tight text-[2.6rem] sm:text-[3.6rem] leading-[1.06]">
              Problem <span style={{ color: GOLD }}>→</span> Solution
            </h1>
            <p className="mt-5 text-[#a9a49a] max-w-lg text-[17px]">Strategy, coaching, analytics, websites, and the hands-on services that keep a business running — under one roof, built around what you actually need.</p>
            <div className="mt-8 flex flex-wrap gap-4">
              <a href="#contact" className="px-6 py-3 rounded-xl font-semibold text-[#0b0f13]" style={{ background: GOLD }}>Book a consultation</a>
              <a href="#services" className="px-6 py-3 rounded-xl font-semibold border border-white/15 hover:border-white/30 transition-colors">See our services</a>
            </div>
          </div>
        </div>
      </section>

      <section id="services" className="relative z-10 py-20 px-8 lg:px-12 border-t border-white/10 bg-[#0b0f13]/40 backdrop-blur-sm">
        <div className="max-w-[1680px] mx-auto">
          <h2 className="font-display font-semibold text-3xl sm:text-4xl">What we do</h2>
          <p className="mt-3 text-[#a9a49a] max-w-xl">Six ways we help — pick one, or lean on several at once.</p>
          <div className="mt-12 grid sm:grid-cols-2 lg:grid-cols-3 gap-6">
            {SERVICES.map((s, i) => <ServiceCard key={s.title} {...s} i={i} revealed={revealed} />)}
          </div>
        </div>
      </section>

      <section id="coaching" className="relative z-10 py-20 px-8 lg:px-12 border-t border-white/10">
        <div className="max-w-[1680px] mx-auto grid md:grid-cols-2 gap-12 items-center">
          <div>
            <h2 className="font-display font-semibold text-3xl sm:text-4xl leading-tight">Coaching for owners who are done guessing.</h2>
            <p className="mt-4 text-[#a9a49a] max-w-md">Regular 1:1 sessions focused on the decisions actually in front of you this month — not generic frameworks.</p>
          </div>
          <ul className="space-y-3 text-[15px] text-[#d8d3c8]">
            <li className="flex gap-3"><span style={{ color: GOLD }}>—</span> Clear, accountable goals each session</li>
            <li className="flex gap-3"><span style={{ color: GOLD }}>—</span> Works alongside our marketing & analytics work, or standalone</li>
            <li className="flex gap-3"><span style={{ color: GOLD }}>—</span> For owners, managers, and small leadership teams</li>
          </ul>
        </div>
      </section>

      <section id="contact" className="relative z-10 py-20 px-8 lg:px-12 border-t border-white/10 bg-[#0b0f13]/40 backdrop-blur-sm">
        <div className="max-w-4xl mx-auto grid md:grid-cols-2 gap-12">
          <div>
            <h2 className="font-display font-semibold text-3xl sm:text-4xl leading-tight">How can we help?</h2>
            <p className="mt-4 text-[#a9a49a]">A quick note on your business and what you need — we'll get back to you as fast as we can.</p>
          </div>
          <form onSubmit={submit} className="space-y-4">
            <input required placeholder="Name" className="w-full bg-transparent border border-white/20 rounded-xl px-4 py-3 text-sm placeholder:text-[#c9c4b8]" />
            <input required placeholder="Business name" className="w-full bg-transparent border border-white/20 rounded-xl px-4 py-3 text-sm placeholder:text-[#c9c4b8]" />
            <div className="grid grid-cols-2 gap-4">
              <input required type="email" placeholder="Email" className="w-full bg-transparent border border-white/20 rounded-xl px-4 py-3 text-sm placeholder:text-[#c9c4b8]" />
              <input required placeholder="Phone" className="w-full bg-transparent border border-white/20 rounded-xl px-4 py-3 text-sm placeholder:text-[#c9c4b8]" />
            </div>
            <select className="w-full bg-transparent border border-white/20 rounded-xl px-4 py-3 text-sm text-[#d8d3c8]">
              <option value="">What do you need help with?</option>
              {SERVICES.map((s) => <option key={s.title}>{s.title}</option>)}
            </select>
            <button type="submit" className="w-full rounded-xl py-3 font-bold text-[#0b0f13]" style={{ background: GOLD }}>Send my enquiry</button>
          </form>
        </div>
      </section>

      <footer className="relative z-10 py-10 px-8 border-t border-white/10">
        <div className="max-w-[1680px] mx-auto flex flex-col items-center gap-5">
          <img src={LOGO_SRC} alt="The Red Envelope NZ" className="w-full max-w-[220px] rounded-lg shadow-lg" />
          <div className="w-full flex flex-col sm:flex-row justify-between items-center gap-3 text-sm text-[#a9a49a]">
            <span className="font-display font-semibold text-base text-[#f2efe9]">The Red Envelope NZ</span>
            <span>© {new Date().getFullYear()} The Red Envelope NZ. Marketing, coaching & business services.</span>
          </div>
        </div>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
